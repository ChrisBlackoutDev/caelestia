packages = ["caelestia-cli", "local:bootstrap/pkgbuilds/caelestia-shell-fork"]
post_install = [
    "test -f ${XDG_STATE_HOME:-$HOME/.local/state}/caelestia/scheme.json || caelestia scheme set -n caelestia",
    "test -z \"$HYPRLAND_INSTANCE_SIGNATURE\" || caelestia shell -d >/dev/null",
]
post_update = ["test -z \"$HYPRLAND_INSTANCE_SIGNATURE\" || { caelestia shell -k; sleep 1; caelestia shell -d >/dev/null; }"]

# --- Core components ---

[[components]]
name = "hypr"
default = true
packages = [
    "hyprland",
    "hyprlock",
    "xdg-desktop-portal-hyprland",
    "xdg-desktop-portal-gtk",
    "ttf-jetbrains-mono-nerd",
]
post_install = ["test -z \"$HYPRLAND_INSTANCE_SIGNATURE\" || hyprctl reload >/dev/null"]
post_update = ["test -z \"$HYPRLAND_INSTANCE_SIGNATURE\" || hyprctl reload >/dev/null"]
[[components.entries]]
src = "hypr"
dest = "$XDG_CONFIG_HOME/hypr"

[[components]]
name = "fish"
default = true
packages = ["fish", "eza", "zoxide", "direnv"]
post_install = [
    "mkdir -p ${XDG_CONFIG_HOME:-$HOME/.config}/caelestia",
    "touch ${XDG_CONFIG_HOME:-$HOME/.config}/caelestia/user-config.fish",
]
[[components.entries]]
src = "fish"
dest = "$XDG_CONFIG_HOME/fish"

[[components]]
name = "foot"
default = true
packages = ["foot", "fish", "ttf-jetbrains-mono-nerd"]
