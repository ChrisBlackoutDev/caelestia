[profile]
name = "kensa-desktop"
description = "ChrisBlackoutDev personal Arch/Hyprland/Caelestia desktop profile"
user = "kensa"

[caelestia]
dots_url = "https://github.com/ChrisBlackoutDev/caelestia.git"
dots_branch = "codex/upstream-refresh-2026-08-05"
aur_helper = "paru"
enable_components = [
    "hypr",
    "fish",
    "foot",
    "fastfetch",
    "btop",
    "micro",
    "thunar",
    "caelestia",
    "app-launchers",
    "ai-panel",
    "terminal-toys",
    "starship",
    "firefox",
    "gtk",
    "qt",
    "auth",
    "network",
    "bluetooth",
    "pipewire",
    "clipboard",
    "fonts",
    "tools",
    "vscode",
    "todoist",
    "uwsm",
    "zen",
]

[packages.official.browsers]
purpose = "Web browsers"
packages = ["firefox", "chromium"]

[packages.official.productivity]
purpose = "Office, notes, documents, and media"
packages = [
    "libreoffice-fresh",
    "obsidian",
    "mpv",
    "gwenview",
    "kolourpaint",
    "krita",
    "zathura",
    "zathura-pdf-mupdf",
    "xournalpp",
    "tesseract-data-eng",
]

[packages.official.desktop]
purpose = "Desktop services, file managers, peripherals, and session plumbing"
packages = [
    "cups",
    "cups-pk-helper",
    "system-config-printer",
    "bluez",
    "bluez-utils",
    "pavucontrol",
    "qps",
    "nemo",
    "gammastep",
    "hyprlock",
    "pipewire",
    "pipewire-alsa",
    "pipewire-jack",
    "pipewire-pulse",
    "wireplumber",
    "wpa_supplicant",
    "openssh",
    "networkmanager",
    "libnm",
    "sddm",
    "power-profiles-daemon",
]

[packages.official.development]
purpose = "Developer tools"
packages = [
    "docker",
    "docker-buildx",
    "docker-compose",
    "github-cli",
    "neovim",
    "fd",
    "ripgrep",
    "rsync",
    "unzip",
    "unrar",
    "zip",
    "7zip",
    "yt-dlp",
    "nodejs",
    "npm",
    "tree-sitter-cli",
    "tinyxxd",
]

[packages.official.system]
purpose = "System health, networking, fonts, graphics, and boot defaults"
packages = [
    "tailscale",
    "mullvad-vpn",
    "mullvad-vpn-daemon",
    "smartmontools",
    "zram-generator",
    "noto-fonts",
    "noto-fonts-cjk",
    "noto-fonts-emoji",
    "ttf-dejavu",
    "ttf-liberation",
    "intel-media-driver",
    "intel-gpu-tools",
    "libva-utils",
]

[packages.official.thumbnails]
purpose = "File manager thumbnail generation"
packages = ["tumbler", "ffmpegthumbnailer", "poppler-glib", "libgsf", "webp-pixbuf-loader"]

[packages.aur.editors]
purpose = "GUI editors and browsers from AUR"
packages = ["visual-studio-code-bin", "cursor-appimage", "zen-browser-bin"]

[packages.aur.apps]
purpose = "Desktop apps from AUR"
packages = [
    "zoom",
    "orca-slicer-bin",
    "betaflight-configurator-bin",
    "todoist-appimage",
    "github-desktop-bin",
]

[packages.aur.shell]
purpose = "Caelestia CLI, runtime dependencies, fonts, and AUR helpers"
packages = [
    "caelestia-cli",
    "quickshell-git",
    "ttf-material-symbols-variable",
    "ttf-rubik-vf",
    "ttf-cascadia-code-nerd",
    "paru",
    "yay",
]

[packages.cleanup]
purpose = "Known accidental provider/default packages to remove before installing preferred packages"
remove_before_install = ["gvim"]
remove_after_install = ["tesseract-data-afr"]

[services]
enable = ["NetworkManager", "bluetooth", "cups", "docker", "tailscaled", "mullvad-daemon"]

[groups]
user = "kensa"
add = ["docker", "uucp"]

[manual]
items = [
    "Authenticate Mullvad and Tailscale after install; do not store credentials in the repo.",
    "Verify printers and Bluetooth devices with local hardware present.",
    "Review Docker group membership after logging out and back in.",
    "Configure Betaflight/serial device permissions only after hardware is connected.",
]
